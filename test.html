<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人名片 - 张三</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            color: white;
            font-weight: bold;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        h1 {
            color: #2d3748;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .title {
            color: #718096;
            font-size: 16px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            margin: 0 auto 20px;
            border-radius: 2px;
        }

        .bio {
            color: #4a5568;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #4a5568;
            font-size: 14px;
            padding: 8px 12px;
            background: #f7fafc;
            border-radius: 10px;
            transition: background 0.2s;
        }

        .contact-item:hover {
            background: #edf2f7;
        }

        .contact-item span {
            font-weight: 500;
            color: #2d3748;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .social-links a {
            color: #718096;
            font-size: 20px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .social-links a:hover {
            color: #667eea;
        }

        /* 响应式调整 */
        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
            
            .avatar {
                width: 100px;
                height: 100px;
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 头像 -->
        <div class="avatar">👨‍💻</div>
        
        <!-- 姓名与职位 -->
        <h1>张三</h1>
        <p class="title">全栈开发工程师 · 技术布道者</p>
        <div class="divider"></div>
        
        <!-- 个人简介 -->
        <p class="bio">
            热爱构建优雅的Web应用，专注于用户体验与性能优化。
            乐于分享技术知识，坚信开源改变世界。
        </p>
        
        <!-- 联系方式 -->
        <div class="contact-info">
            <div class="contact-item">
                📧 <span>zhangsan@example.com</span>
            </div>
            <div class="contact-item">
                📱 <span>+86 138 0000 8888</span>
            </div>
            <div class="contact-item">
                📍 <span>中国 · 北京</span>
            </div>
        </div>
        
        <!-- 主要操作按钮 -->
        <button class="btn" id="greetBtn">👋 打个招呼</button>
        
        <!-- 社交媒体链接 -->
        <div class="social-links">
            <a href="#" title="GitHub">🐙</a>
            <a href="#" title="Twitter">🐦</a>
            <a href="#" title="LinkedIn">🔗</a>
            <a href="#" title="个人博客">📝</a>
        </div>
    </div>

    <script>
        // 交互功能：点击按钮弹出欢迎消息
        document.getElementById('greetBtn').addEventListener('click', function() {
            const name = '张三';
            const message = `你好！我是${name}，很高兴认识你！ 🚀`;
            alert(message);
            
            // 按钮点击反馈效果
            this.textContent = '✨ 已打招呼！';
            setTimeout(() => {
                this.textContent = '👋 打个招呼';
            }, 2000);
        });

        // 控制台输出信息
        console.log('🎯 个人名片已加载！欢迎访问！');
    </script>
</body>
</html>
