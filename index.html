<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2510班资源站</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #5B6AF0;
            --primary-light: #7B8AFF;
            --primary-dark: #4A56D0;
            --secondary: #8B5CF6;
            --gradient: linear-gradient(135deg, #5B6AF0 0%, #8B5CF6 100%);
            --bg: #F0F4FF;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-shadow: 0 8px 32px rgba(91, 106, 240, 0.15);
            --text-primary: #1A1A2E;
            --text-secondary: #4A4A6A;
            --text-light: #8A8AAA;
            --border-radius: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --admin-color: #7C3AED;
            --owner-color: #DC2626;
            --banned-color: #9CA3AF;
            --official-color: #059669;
            --teacher-color: #F59E0B;
            --vip-color: #2563EB;
        }

        /* ====== RGB 变色彩名动画（只改名字颜色） ====== */
        @keyframes rgbText {
            0% { color: #ff0000; }
            16% { color: #ff8800; }
            33% { color: #ffff00; }
            50% { color: #00ff00; }
            66% { color: #0088ff; }
            83% { color: #8800ff; }
            100% { color: #ff0000; }
        }

        .name-rgb {
            animation: rgbText 3s linear infinite;
            font-weight: 700 !important;
        }

        /* ====== 黄紫渐变（只改名字颜色） ====== */
        .name-yellow-purple {
            background: linear-gradient(135deg, #FFD700, #8B5CF6, #FFD700);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700 !important;
            animation: gradientShift 3s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 分类颜色 */
        .cat-语文 { color: #EF4444; background: rgba(239,68,68,0.10); }
        .cat-数学 { color: #3B82F6; background: rgba(59,130,246,0.10); }
        .cat-英语 { color: #22C55E; background: rgba(34,197,94,0.10); }
        .cat-生物 { color: #8B5CF6; background: rgba(139,92,246,0.10); }
        .cat-地理 { color: #F59E0B; background: rgba(245,158,11,0.10); }
        .cat-历史 { color: #EC4899; background: rgba(236,72,153,0.10); }
        .cat-政治 { color: #DC2626; background: rgba(220,38,38,0.10); }
        .cat-物理 { color: #06B6D4; background: rgba(6,182,212,0.10); }
        .cat-化学 { color: #8B5CF6; background: rgba(139,92,246,0.10); }
        .cat-综合 { color: #6366F1; background: rgba(99,102,241,0.10); }
        .cat-其他 { color: #6B7280; background: rgba(107,114,128,0.10); }

        body {
            font-family: var(--font);
            background: var(--bg);
            min-height: 100vh;
            padding: 24px;
            color: var(--text-primary);
            background-image: radial-gradient(ellipse at 10% 20%, rgba(91, 106, 240, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 90% 80%, rgba(139, 92, 246, 0.06) 0%, transparent 60%);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.04);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        .app-container {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* ========== 顶栏 ========== */
        .topbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 12px 28px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: var(--transition);
        }

        .topbar:hover {
            box-shadow: 0 12px 40px rgba(91, 106, 240, 0.20);
        }

        .topbar .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .topbar .brand i {
            -webkit-text-fill-color: var(--primary);
            font-size: 24px;
        }

        .topbar .user-section {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .topbar .user-section .username-display {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .topbar .user-section .username-display i {
            color: var(--primary);
        }

        .topbar .user-section .username-display .vip-tag {
            font-size: 10px;
            font-weight: 700;
            background: var(--vip-color);
            color: #fff;
            padding: 2px 10px;
            border-radius: 12px;
            margin-left: 4px;
        }

        .topbar .user-section .username-display .teacher-tag {
            font-size: 10px;
            font-weight: 700;
            background: var(--teacher-color);
            color: #fff;
            padding: 2px 10px;
            border-radius: 12px;
            margin-left: 4px;
        }

        .topbar .user-section .username-display .official-tag {
            font-size: 10px;
            font-weight: 700;
            background: var(--official-color);
            color: #fff;
            padding: 2px 10px;
            border-radius: 12px;
            margin-left: 4px;
        }

        .topbar .user-section .username-display .admin-tag {
            font-size: 10px;
            font-weight: 700;
            background: var(--admin-color);
            color: #fff;
            padding: 2px 10px;
            border-radius: 12px;
            margin-left: 4px;
        }

        .topbar .user-section .username-display .owner-tag {
            font-size: 10px;
            font-weight: 700;
            background: var(--owner-color);
            color: #fff;
            padding: 2px 10px;
            border-radius: 12px;
            margin-left: 4px;
        }

        .topbar .user-section .username-display .banned-tag {
            font-size: 10px;
            font-weight: 700;
            background: var(--banned-color);
            color: #fff;
            padding: 2px 10px;
            border-radius: 12px;
            margin-left: 4px;
        }

        .topbar .user-section .username-display .custom-tag {
            font-size: 10px;
            font-weight: 700;
            background: linear-gradient(135deg, #FFD700, #8B5CF6);
            color: #fff;
            padding: 2px 10px;
            border-radius: 12px;
            margin-left: 4px;
        }

        .topbar .user-section .username-display .banned-name {
            color: var(--banned-color);
            font-weight: 700;
        }

        .topbar .user-section .username-display .admin-name {
            color: var(--admin-color);
            font-weight: 700;
        }

        .topbar .user-section .username-display .owner-name {
            color: var(--owner-color);
            font-weight: 700;
        }

        .topbar .user-section .username-display .official-name {
            color: var(--official-color);
            font-weight: 700;
        }

        .topbar .user-section .username-display .teacher-name {
            color: var(--teacher-color);
            font-weight: 700;
        }

        .topbar .user-section .username-display .vip-name {
            color: var(--vip-color);
            font-weight: 700;
        }

        .topbar .user-section .username-display .user-id {
            font-size: 11px;
            color: var(--text-light);
            font-weight: 400;
            background: rgba(0, 0, 0, 0.05);
            padding: 1px 10px;
            border-radius: 10px;
        }

        .topbar .user-section .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
        }

        .topbar .user-section .btn-login {
            background: var(--gradient);
            color: #fff;
            box-shadow: 0 4px 12px rgba(91, 106, 240, 0.30);
        }

        .topbar .user-section .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(91, 106, 240, 0.40);
        }

        .topbar .user-section .btn-register {
            background: rgba(91, 106, 240, 0.08);
            color: var(--primary);
        }

        .topbar .user-section .btn-register:hover {
            background: rgba(91, 106, 240, 0.16);
        }

        .topbar .user-section .btn-logout {
            background: rgba(239, 68, 68, 0.08);
            color: #EF4444;
        }

        .topbar .user-section .btn-logout:hover {
            background: rgba(239, 68, 68, 0.16);
        }

        /* ========== 管理按钮 ========== */
        .admin-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .admin-buttons .admin-action-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .admin-buttons .admin-action-btn:hover {
            transform: translateY(-1px);
        }

        .admin-buttons .admin-action-btn.review-btn {
            background: rgba(91, 106, 240, 0.10);
            color: var(--primary);
        }

        .admin-buttons .admin-action-btn.review-btn:hover {
            background: rgba(91, 106, 240, 0.18);
        }

        .admin-buttons .admin-action-btn.ban-btn {
            background: rgba(239, 68, 68, 0.08);
            color: #EF4444;
        }

        .admin-buttons .admin-action-btn.ban-btn:hover {
            background: rgba(239, 68, 68, 0.16);
        }

        .admin-buttons .admin-action-btn.reports-btn {
            background: rgba(245, 158, 11, 0.08);
            color: #D97706;
        }

        .admin-buttons .admin-action-btn.reports-btn:hover {
            background: rgba(245, 158, 11, 0.16);
        }

        .admin-buttons .admin-action-btn.notif-btn {
            background: rgba(236, 72, 153, 0.08);
            color: #EC4899;
        }

        .admin-buttons .admin-action-btn.notif-btn:hover {
            background: rgba(236, 72, 153, 0.16);
        }

        /* ========== 头部 ========== */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 20px 28px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: var(--transition);
        }

        .header:hover {
            box-shadow: 0 12px 40px rgba(91, 106, 240, 0.20);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-logo {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(91, 106, 240, 0.35);
            flex-shrink: 0;
        }

        .header-title {
            font-size: 26px;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
        }

        .header-badge {
            font-size: 13px;
            font-weight: 600;
            background: rgba(91, 106, 240, 0.12);
            color: var(--primary);
            padding: 4px 14px;
            border-radius: 20px;
            margin-left: 6px;
            -webkit-text-fill-color: var(--primary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .header-stats span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-stats i {
            color: var(--primary);
            font-size: 15px;
        }

        .header-stats .num {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 16px;
        }

        /* ========== 存储用量 ========== */
        .storage-bar {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--border-radius);
            padding: 12px 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .storage-bar .storage-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .storage-bar .storage-track {
            flex: 1;
            min-width: 120px;
            height: 8px;
            background: rgba(0, 0, 0, 0.06);
            border-radius: 10px;
            overflow: hidden;
        }

        .storage-bar .storage-track .fill {
            height: 100%;
            width: 0%;
            background: var(--gradient);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .storage-bar .storage-track .fill.warning {
            background: #F59E0B;
        }

        .storage-bar .storage-track .fill.danger {
            background: #EF4444;
        }

        .storage-bar .storage-text {
            font-size: 13px;
            color: var(--text-light);
            white-space: nowrap;
        }

        /* ========== 公告区域 ========== */
        .announcement-section {
            margin-bottom: 24px;
        }

        .announcement-section .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .announcement-section .section-title i {
            color: var(--primary);
        }

        .announcement-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .announcement-item {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--border-radius);
            padding: 16px 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            transition: var(--transition);
            position: relative;
        }

        .announcement-item:hover {
            box-shadow: 0 8px 24px rgba(91, 106, 240, 0.10);
            transform: translateY(-1px);
        }

        .announcement-item.pinned {
            border-left: 4px solid #F59E0B;
            background: rgba(245, 158, 11, 0.04);
        }

        .announcement-item .announcement-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 6px;
        }

        .announcement-item .announcement-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .announcement-item .announcement-title .pin-icon {
            color: #F59E0B;
            font-size: 14px;
        }

        .announcement-item .announcement-meta {
            font-size: 12px;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .announcement-item .announcement-meta .author-name {
            font-weight: 600;
        }

        .announcement-item .announcement-meta .author-name.admin {
            color: var(--admin-color);
        }

        .announcement-item .announcement-meta .author-name.owner {
            color: var(--owner-color);
        }

        .announcement-item .announcement-meta .author-name.official {
            color: var(--official-color);
        }

        .announcement-item .announcement-meta .author-name.teacher {
            color: var(--teacher-color);
        }

        .announcement-item .announcement-meta .author-name.vip {
            color: var(--vip-color);
        }

        .announcement-item .announcement-meta .author-name.banned {
            color: var(--banned-color);
        }

        .announcement-item .announcement-meta .tag {
            font-size: 10px;
            font-weight: 700;
            padding: 1px 10px;
            border-radius: 10px;
        }

        .announcement-item .announcement-meta .tag.admin-tag {
            background: var(--admin-color);
            color: #fff;
        }

        .announcement-item .announcement-meta .tag.owner-tag {
            background: var(--owner-color);
            color: #fff;
        }

        .announcement-item .announcement-meta .tag.official-tag {
            background: var(--official-color);
            color: #fff;
        }

        .announcement-item .announcement-meta .tag.teacher-tag {
            background: var(--teacher-color);
            color: #fff;
        }

        .announcement-item .announcement-meta .tag.vip-tag {
            background: var(--vip-color);
            color: #fff;
        }

        .announcement-item .announcement-meta .tag.banned-tag {
            background: var(--banned-color);
            color: #fff;
        }

        .announcement-item .announcement-meta .tag.custom-tag {
            background: linear-gradient(135deg, #FFD700, #8B5CF6);
            color: #fff;
        }

        .announcement-item .announcement-meta .tag.pinned-tag {
            background: #F59E0B;
            color: #fff;
        }

        .announcement-item .announcement-content {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-top: 4px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .announcement-item .announcement-actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .announcement-item .announcement-actions button {
            padding: 4px 14px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
        }

        .announcement-item .announcement-actions .delete-announce-btn {
            background: rgba(239, 68, 68, 0.08);
            color: #EF4444;
        }

        .announcement-item .announcement-actions .delete-announce-btn:hover {
            background: rgba(239, 68, 68, 0.16);
        }

        .announcement-item .announcement-actions .pin-announce-btn {
            background: rgba(245, 158, 11, 0.08);
            color: #F59E0B;
        }

        .announcement-item .announcement-actions .pin-announce-btn:hover {
            background: rgba(245, 158, 11, 0.16);
        }

        .announcement-item .announcement-actions .pin-announce-btn.pinned {
            background: rgba(34, 197, 94, 0.08);
            color: #22C55E;
        }

        .announcement-item .announcement-actions .pin-announce-btn.pinned:hover {
            background: rgba(34, 197, 94, 0.16);
        }

        .announcement-item.announcement-hidden {
            display: none;
        }

        .announcement-item.announcement-hidden.show {
            display: block;
        }

        .announcement-toggle {
            text-align: center;
            margin-top: 8px;
        }

        .announcement-toggle button {
            padding: 8px 20px;
            border: none;
            border-radius: 10px;
            background: rgba(91, 106, 240, 0.08);
            color: var(--primary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
        }

        .announcement-toggle button:hover {
            background: rgba(91, 106, 240, 0.16);
        }

        /* ========== 发布公告表单 ========== */
        .announcement-form {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--border-radius);
            padding: 20px 24px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            display: none;
        }

        .announcement-form.active {
            display: block;
        }

        .announcement-form .form-row {
            margin-bottom: 12px;
        }

        .announcement-form .form-row label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .announcement-form .form-row input,
        .announcement-form .form-row textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            transition: var(--transition);
            font-family: var(--font);
            outline: none;
            background: #f8fafc;
        }

        .announcement-form .form-row input:focus,
        .announcement-form .form-row textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(91, 106, 240, 0.12);
            background: #fff;
        }

        .announcement-form .form-row textarea {
            min-height: 80px;
            resize: vertical;
        }

        .announcement-form .form-actions {
            display: flex;
            gap: 10px;
        }

        .announcement-form .form-actions button {
            padding: 8px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
        }

        .announcement-form .form-actions .submit-btn {

            padding: 0 16px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: var(--transition);
        }

        .search-box:focus-within {
            box-shadow: 0 0 0 3px rgba(91, 106, 240, 0.20), 0 4px 12px rgba(0, 0, 0, 0.06);
            border-color: var(--primary-light);
        }

        .search-box i {
            color: var(--text-light);
            font-size: 16px;
        }

        .search-box input {
            border: none;
            background: transparent;
            padding: 12px 12px 12px 10px;
            font-size: 15px;
            flex: 1;
            outline: none;
            color: var(--text-primary);
            font-family: var(--font);
        }

        .search-box input::placeholder {
            color: var(--text-light);
        }

        .filter-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 18px;
            border-radius: 20px;
            border: none;
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.5);
            font-family: var(--font);
        }

        .filter-btn:hover {
            background: rgba(91, 106, 240, 0.08);
            color: var(--primary);
            transform: translateY(-1px);
        }

        .filter-btn.active {
            background: var(--gradient);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(91, 106, 240, 0.30);
        }

        /* ========== 上传区域 ========== */
        .upload-zone {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--border-radius);
            border: 2px dashed rgba(91, 106, 240, 0.25);
            padding: 48px 32px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 28px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
        }

        .upload-zone:hover {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.95);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(91, 106, 240, 0.10);
        }

        .upload-zone.dragover {
            border-color: var(--primary);
            background: rgba(91, 106, 240, 0.06);
            transform: scale(1.01);
            box-shadow: 0 8px 40px rgba(91, 106, 240, 0.15);
        }

        .upload-zone .icon-wrapper {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(91, 106, 240, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 32px;
            color: var(--primary);
            transition: var(--transition);
        }

        .upload-zone:hover .icon-wrapper {
            background: rgba(91, 106, 240, 0.15);
            transform: scale(1.05);
        }

        .upload-zone h3 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .upload-zone p {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .upload-zone .hint {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 8px;
            opacity: 0.7;
        }

        .upload-zone input[type="file"] {
            display: none;
        }

        /* ========== 分类选择器 ========== */
        .category-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 12px 0 8px;
        }

        .category-selector .cat-option {
            padding: 4px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            background: #f8fafc;
            color: var(--text-secondary);
        }

        .category-selector .cat-option:hover {
            transform: scale(1.05);
            border-color: var(--primary);
        }

        .category-selector .cat-option.selected {
            border-color: var(--primary);
            background: rgba(91, 106, 240, 0.08);
            color: var(--primary);
        }

        /* ========== 上传进度 ========== */
        .upload-progress-container {
            margin-bottom: 24px;
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        .upload-progress-container.active {
            display: flex;
        }

        .upload-progress-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 10px 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.5);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .upload-progress-item .file-icon {
            font-size: 22px;
            color: var(--primary);
            flex-shrink: 0;
        }

        .upload-progress-item .info {
            flex: 1;
            min-width: 0;
        }

        .upload-progress-item .info .name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .upload-progress-item .info .size {
            font-size: 12px;
            color: var(--text-light);
        }

        .upload-progress-item .progress-track {
            width: 120px;
            height: 6px;
            background: rgba(0, 0, 0, 0.06);
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .upload-progress-item .progress-track .fill {
            height: 100%;
            width: 0%;
            background: var(--gradient);
            border-radius: 10px;
            transition: width 0.2s ease;
        }

        .upload-progress-item .status {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            flex-shrink: 0;
            min-width: 48px;
            text-align: right;
        }

        /* ========== 资源列表 ========== */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .section-header h2 {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-header h2 span {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-light);
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 18px;
            margin-bottom: 24px;
        }

        /* ========== 文件卡片 ========== */
        .file-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--border-radius);
            padding: 20px 18px 16px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.4s ease;
            position: relative;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.94) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .file-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(91, 106, 240, 0.14);
            border-color: rgba(91, 106, 240, 0.20);
        }

        .file-card .file-icon-big {
            font-size: 42px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 56px;
            color: var(--primary);
        }

        .file-card .file-name {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .file-card .file-status-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 6px;
            align-self: flex-start;
        }

        .file-card .file-status-badge.pending {
            background: #FEF3C7;
            color: #D97706;
        }

        .file-card .file-status-badge.approved {
            background: #D1FAE5;
            color: #059669;
        }

        .file-card .file-status-badge.rejected {
            background: #FEE2E2;
            color: #DC2626;
        }

        .file-card .file-meta {
            font-size: 12px;
            color: var(--text-light);
            display: flex;
            justify-content: space-between;
            margin-top: 2px;
            margin-bottom: 8px;
        }

        .file-card .file-category-tag {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 6px;
            align-self: flex-start;
        }

        .file-card .file-uploader {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .file-card .file-uploader .uploader-name {
            font-weight: 600;
            color: #1A1A2E;
        }

        .file-card .file-uploader .uploader-name.admin {
            color: var(--admin-color);
        }

        .file-card .file-uploader .uploader-name.owner {
            color: var(--owner-color);
        }

        .file-card .file-uploader .uploader-name.official {
            color: var(--official-color);
        }

        .file-card .file-uploader .uploader-name.teacher {
            color: var(--teacher-color);
        }

        .file-card .file-uploader .uploader-name.vip {
            color: var(--vip-color);
        }

        .file-card .file-uploader .uploader-name.banned {
            color: var(--banned-color);
        }

        .file-card .file-uploader .official-tag {
            font-size: 9px;
            font-weight: 700;
            background: var(--official-color);
            color: #fff;
            padding: 1px 8px;
            border-radius: 10px;
            margin-left: 2px;
        }

        .file-card .file-uploader .teacher-tag {
            font-size: 9px;
            font-weight: 700;
            background: var(--teacher-color);
            color: #fff;
            padding: 1px 8px;
            border-radius: 10px;
            margin-left: 2px;
        }

        .file-card .file-uploader .vip-tag {
            font-size: 9px;
            font-weight: 700;
            background: var(--vip-color);
            color: #fff;
            padding: 1px 8px;
            border-radius: 10px;
            margin-left: 2px;
        }

        .file-card .file-uploader .admin-tag {
            font-size: 9px;
            font-weight: 700;
            background: var(--admin-color);
            color: #fff;
            padding: 1px 8px;
            border-radius: 10px;
            margin-left: 2px;
        }

        .file-card .file-uploader .owner-tag {
            font-size: 9px;
            font-weight: 700;
            background: var(--owner-color);
            color: #fff;
            padding: 1px 8px;
            border-radius: 10px;
            margin-left: 2px;
        }

        .file-card .file-uploader .banned-tag {
            font-size: 9px;
            font-weight: 700;
            background: var(--banned-color);
            color: #fff;
            padding: 1px 8px;
            border-radius: 10px;
            margin-left: 2px;
        }

        .file-card .file-uploader .custom-tag {
            font-size: 9px;
            font-weight: 700;
            background: linear-gradient(135deg, #FFD700, #8B5CF6);
            color: #fff;
            padding: 1px 8px;
            border-radius: 10px;
            margin-left: 2px;
        }

        .file-card .file-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            padding-top: 12px;
        }

        .file-card .file-actions button {
            flex: 1;
            padding: 7px 0;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .file-card .file-actions .download-btn {
            background: rgba(91, 106, 240, 0.08);
            color: var(--primary);
        }

        .file-card .file-actions .download-btn:hover {
            background: rgba(91, 106, 240, 0.16);
        }

        .file-card .file-actions .delete-btn {
            background: rgba(239, 68, 68, 0.06);
            color: #EF4444;
        }

        .file-card .file-actions .delete-btn:hover {
            background: rgba(239, 68, 68, 0.14);
        }

        .file-card .file-actions .delete-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .file-card .file-actions .report-btn {
            background: rgba(239, 68, 68, 0.04);
            color: #EF4444;
            font-size: 12px;
        }

        .file-card .file-actions .report-btn:hover {
            background: rgba(239, 68, 68, 0.10);
        }

        .file-card .file-type-tag {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 12px;
            background: rgba(91, 106, 240, 0.08);
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            z-index: 3;
        }

        /* ========== 空状态 ========== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: var(--border-radius);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .empty-state .empty-icon {
            font-size: 64px;
            color: var(--text-light);
            opacity: 0.3;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .empty-state p {
            color: var(--text-light);
            font-size: 14px;
            margin-top: 4px;
        }

        /* ========== 封禁记录弹窗 ========== */
        .ban-records-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.40);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeInOverlay 0.25s ease;
        }

        .ban-records-modal-overlay.active {
            display: flex;
        }

        .ban-records-modal {
            background: #fff;
            border-radius: var(--border-radius);
            padding: 28px 24px 24px;
            max-width: 700px;
            width: 92%;
            max-height: 80vh;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.20);
            animation: scaleIn 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .ban-records-modal .close-btn {
            position: absolute;
            top: 14px;
            right: 18px;
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-light);
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
        }

        .ban-records-modal .close-btn:hover {
            color: var(--text-primary);
            transform: rotate(90deg);
        }

        .ban-records-modal .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ban-records-modal .modal-title i {
            color: #EF4444;
        }

        .ban-records-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ban-records-list .ban-record-item {
            background: #f8fafc;
            border-radius: 10px;
            padding: 12px 16px;
            border-left: 4px solid #EF4444;
        }

        .ban-records-list .ban-record-item .record-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }

        .ban-records-list .ban-record-item .record-user {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 14px;
        }

        .ban-records-list .ban-record-item .record-admin {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .ban-records-list .ban-record-item .record-admin span {
            color: var(--primary);
            font-weight: 600;
        }

        .ban-records-list .ban-record-item .record-reason {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .ban-records-list .ban-record-item .record-time {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 2px;
        }

        .ban-records-list .ban-record-item .record-actions {
            margin-top: 6px;
            display: flex;
            gap: 6px;
        }

        .ban-records-list .ban-record-item .record-actions button {
            padding: 4px 14px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            background: rgba(34, 197, 94, 0.08);
            color: #22C55E;
        }

        .ban-records-list .ban-record-item .record-actions button:hover {
            background: rgba(34, 197, 94, 0.16);
        }

        .ban-records-list .empty-records {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-light);
            font-size: 14px;
        }

        .ban-records-list .empty-records i {
            font-size: 32px;
            opacity: 0.3;
            display: block;
            margin-bottom: 8px;
        }

        .ban-records-modal .modal-actions {
            margin-top: 16px;
            text-align: right;
        }

        .ban-records-modal .modal-actions button {
            padding: 8px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            background: #F1F3F5;
            color: var(--text-secondary);
        }

        .ban-records-modal .modal-actions button:hover {
            background: #E5E7EB;
        }

        /* ========== 底部 ========== */
        .footer {
            text-align: center;
            padding: 20px 0 8px;
            font-size: 13px;
            color: var(--text-light);
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            margin-top: 12px;
        }

        .footer .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        .footer .footer-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .footer .footer-links a:hover {
            text-decoration: underline;
        }

        .footer .dev-credit {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 4px;
        }

        .footer .dev-credit a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer .dev-credit a:hover {
            text-decoration: underline;
        }

        /* ========== Toast ========== */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
            width: 100%;
        }

        .toast {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.35s ease;
            font-size: 14px;
            font-weight: 500;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .toast.success {
            border-left: 4px solid #22C55E;
        }
        .toast.error {
            border-left: 4px solid #EF4444;
        }
        .toast.info {
            border-left: 4px solid var(--primary);
        }

        .toast .toast-icon {
            font-size: 20px;
        }
        .toast.success .toast-icon {
            color: #22C55E;
        }
        .toast.error .toast-icon {
            color: #EF4444;
        }
        .toast.info .toast-icon {
            color: var(--primary);
        }

        /* ========== 删除确认弹窗 ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 9998;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeInOverlay 0.25s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #fff;
            border-radius: var(--border-radius);
            padding: 32px 28px 24px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.20);
            text-align: center;
            animation: scaleIn 0.3s ease;
        }

        .modal-box .modal-icon {
            font-size: 48px;
            color: #EF4444;
            margin-bottom: 12px;
        }

        .modal-box h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .modal-box p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 20px;
