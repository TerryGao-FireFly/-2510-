<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2510班资源站</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ========== CSS 变量与重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #5B6AF0;
            --primary-light: #7B8AFF;
            --primary-dark: #4A56D0;
            --secondary: #8B5CF6;
            --gradient: linear-gradient(135deg, #5B6AF0 0%, #8B5CF6 100%);
            --bg: #F0F4FF;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-shadow: 0 8px 32px rgba(91, 106, 240, 0.15);
            --text-primary: #1A1A2E;
            --text-secondary: #4A4A6A;
            --text-light: #8A8AAA;
            --border-radius: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --admin-color: #7C3AED;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            min-height: 100vh;
            padding: 24px;
            color: var(--text-primary);
            background-image: radial-gradient(ellipse at 10% 20%, rgba(91, 106, 240, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 90% 80%, rgba(139, 92, 246, 0.06) 0%, transparent 60%);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.04);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        .app-container {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* ========== 顶栏 ========== */
        .topbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 12px 28px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: var(--transition);
        }

        .topbar:hover {
            box-shadow: 0 12px 40px rgba(91, 106, 240, 0.20);
        }

        .topbar .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .topbar .brand i {
            -webkit-text-fill-color: var(--primary);
            font-size: 24px;
        }

        .topbar .user-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .topbar .user-section .username-display {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .topbar .user-section .username-display i {
            color: var(--primary);
        }

        .topbar .user-section .username-display .admin-tag {
            font-size: 10px;
            font-weight: 700;
            background: var(--admin-color);
            color: #fff;
            padding: 2px 10px;
            border-radius: 12px;
            margin-left: 4px;
        }

        .topbar .user-section .username-display .admin-name {
            color: var(--admin-color);
            font-weight: 700;
        }

        .topbar .user-section .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
        }

        .topbar .user-section .btn-login {
            background: var(--gradient);
            color: #fff;
            box-shadow: 0 4px 12px rgba(91, 106, 240, 0.30);
        }

        .topbar .user-section .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(91, 106, 240, 0.40);
        }

        .topbar .user-section .btn-register {
            background: rgba(91, 106, 240, 0.08);
            color: var(--primary);
        }

        .topbar .user-section .btn-register:hover {
            background: rgba(91, 106, 240, 0.16);
        }

        .topbar .user-section .btn-logout {
            background: rgba(239, 68, 68, 0.08);
            color: #EF4444;
        }

        .topbar .user-section .btn-logout:hover {
            background: rgba(239, 68, 68, 0.16);
        }

        /* ========== 头部 ========== */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 20px 28px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: var(--transition);
        }

        .header:hover {
            box-shadow: 0 12px 40px rgba(91, 106, 240, 0.20);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-logo {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(91, 106, 240, 0.35);
            flex-shrink: 0;
        }

        .header-title {
            font-size: 26px;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
        }

        .header-badge {
            font-size: 13px;
            font-weight: 600;
            background: rgba(91, 106, 240, 0.12);
            color: var(--primary);
            padding: 4px 14px;
            border-radius: 20px;
            margin-left: 6px;
            -webkit-text-fill-color: var(--primary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .header-stats span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-stats i {
            color: var(--primary);
            font-size: 15px;
        }

        .header-stats .num {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 16px;
        }

        /* ========== 登录/注册模态框 ========== */
        .auth-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.40);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeInOverlay 0.25s ease;
        }

        .auth-modal-overlay.active {
            display: flex;
        }

        @keyframes fadeInOverlay {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .auth-modal {
            background: #fff;
            border-radius: var(--border-radius);
            padding: 36px 32px 28px;
            max-width: 420px;
            width: 92%;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.20);
            animation: scaleIn 0.3s ease;
            position: relative;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.92);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .auth-modal .close-btn {
            position: absolute;
            top: 14px;
            right: 18px;
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-light);
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
        }

        .auth-modal .close-btn:hover {
            color: var(--text-primary);
            transform: rotate(90deg);
        }

        .auth-modal .auth-title {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .auth-modal .auth-subtitle {
            text-align: center;
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 24px;
        }

        .auth-modal .auth-subtitle a {
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .auth-modal .auth-subtitle a:hover {
            text-decoration: underline;
        }

        .auth-modal .form-group {
            margin-bottom: 16px;
        }

        .auth-modal .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .auth-modal .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: var(--transition);
            font-family: var(--font);
            outline: none;
            background: #f8fafc;
        }

        .auth-modal .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(91, 106, 240, 0.12);
            background: #fff;
        }

        .auth-modal .form-group .error-text {
            font-size: 12px;
            color: #EF4444;
            margin-top: 4px;
            display: none;
        }

        .auth-modal .form-group .error-text.show {
            display: block;
        }

        .auth-modal .btn-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: var(--gradient);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            margin-top: 8px;
        }

        .auth-modal .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(91, 106, 240, 0.35);
        }

        .auth-modal .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ========== 介绍横幅 ========== */
        .intro-banner {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--border-radius);
            padding: 28px 32px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 24px;
        }

        .intro-banner:hover {
            box-shadow: 0 12px 40px rgba(91, 106, 240, 0.18);
        }

        .intro-banner .intro-avatar {
            flex-shrink: 0;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #fff;
            box-shadow: 0 4px 16px rgba(91, 106, 240, 0.30);
        }

        .intro-banner .intro-content {
            flex: 1;
            min-width: 200px;
        }

        .intro-banner .intro-content .intro-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .intro-banner .intro-content .intro-title .tag {
            font-size: 12px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 12px;
            background: rgba(91, 106, 240, 0.10);
            color: var(--primary);
        }

        .intro-banner .intro-content .intro-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 6px;
            line-height: 1.6;
        }

        .intro-banner .intro-features {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 28px;
            flex-shrink: 0;
        }

        .intro-banner .intro-features .feature-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .intro-banner .intro-features .feature-item i {
            font-size: 16px;
            color: var(--primary);
        }

        /* ========== 工具栏 ========== */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding: 0 4px;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            display: flex;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 0 16px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: var(--transition);
        }

        .search-box:focus-within {
            box-shadow: 0 0 0 3px rgba(91, 106, 240, 0.20), 0 4px 12px rgba(0, 0, 0, 0.06);
            border-color: var(--primary-light);
        }

        .search-box i {
            color: var(--text-light);
            font-size: 16px;
        }

        .search-box input {
            border: none;
            background: transparent;
            padding: 12px 12px 12px 10px;
            font-size: 15px;
            flex: 1;
            outline: none;
            color: var(--text-primary);
            font-family: var(--font);
        }

        .search-box input::placeholder {
            color: var(--text-light);
        }

        .filter-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 18px;
            border-radius: 20px;
            border: none;
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.5);
            font-family: var(--font);
        }

        .filter-btn:hover {
            background: rgba(91, 106, 240, 0.08);
            color: var(--primary);
            transform: translateY(-1px);
        }

        .filter-btn.active {
            background: var(--gradient);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(91, 106, 240, 0.30);
        }

        /* ========== 上传区域 ========== */
        .upload-zone {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--border-radius);
            border: 2px dashed rgba(91, 106, 240, 0.25);
            padding: 48px 32px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 28px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
        }

        .upload-zone:hover {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.95);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(91, 106, 240, 0.10);
        }

        .upload-zone.dragover {
            border-color: var(--primary);
            background: rgba(91, 106, 240, 0.06);
            transform: scale(1.01);
            box-shadow: 0 8px 40px rgba(91, 106, 240, 0.15);
        }

        .upload-zone .icon-wrapper {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(91, 106, 240, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 32px;
            color: var(--primary);
            transition: var(--transition);
        }

        .upload-zone:hover .icon-wrapper {
            background: rgba(91, 106, 240, 0.15);
            transform: scale(1.05);
        }

        .upload-zone h3 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .upload-zone p {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .upload-zone .hint {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 8px;
            opacity: 0.7;
        }

        .upload-zone input[type="file"] {
            display: none;
        }

        /* ========== 上传进度 ========== */
        .upload-progress-container {
            margin-bottom: 24px;
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        .upload-progress-container.active {
            display: flex;
        }

        .upload-progress-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 10px 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.5);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .upload-progress-item .file-icon {
            font-size: 22px;
            color: var(--primary);
            flex-shrink: 0;
        }

        .upload-progress-item .info {
            flex: 1;
            min-width: 0;
        }

        .upload-progress-item .info .name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .upload-progress-item .info .size {
            font-size: 12px;
            color: var(--text-light);
        }

        .upload-progress-item .progress-track {
            width: 120px;
            height: 6px;
            background: rgba(0, 0, 0, 0.06);
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .upload-progress-item .progress-track .fill {
            height: 100%;
            width: 0%;
            background: var(--gradient);
            border-radius: 10px;
            transition: width 0.2s ease;
        }

        .upload-progress-item .status {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            flex-shrink: 0;
            min-width: 48px;
            text-align: right;
        }

        /* ========== 资源列表 ========== */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .section-header h2 {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-header h2 span {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-light);
        }

        .clear-btn {
            padding: 6px 16px;
            border-radius: 10px;
            border: none;
            background: rgba(239, 68, 68, 0.08);
            color: #EF4444;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .clear-btn:hover {
            background: rgba(239, 68, 68, 0.15);
            transform: scale(1.02);
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 18px;
            margin-bottom: 24px;
        }

        /* ========== 文件卡片 ========== */
        .file-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--border-radius);
            padding: 20px 18px 16px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.4s ease;
            position: relative;
        }

        .file-card .locked-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: var(--border-radius);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            z-index: 2;
        }

        .file-card .locked-overlay i {
            font-size: 32px;
            color: var(--primary);
            opacity: 0.6;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.94) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .file-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(91, 106, 240, 0.14);
            border-color: rgba(91, 106, 240, 0.20);
        }

        .file-card .file-icon-big {
            font-size: 42px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 56px;
            color: var(--primary);
        }

        .file-card .file-name {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .file-card .file-meta {
            font-size: 12px;
            color: var(--text-light);
            display: flex;
            justify-content: space-between;
            margin-top: 2px;
            margin-bottom: 8px;
        }

        .file-card .file-uploader {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .file-card .file-uploader .uploader-name {
            font-weight: 600;

        // ========================================================================

        const SUPABASE_URL = "https://wcavdwtanompuugraewr.supabase.co";
        const SUPABASE_ANON_KEY =
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjYXZkd3Rhbm9tcHV1Z3JhZXdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNTA2ODQsImV4cCI6MjEwMjYyNjY4NH0.I8__ydLirwnfEG-ijHEaa-JMaoTY2EBBlwN2TCkETSk";

        // ========================================================================
        //  1. Supabase 客户端
        // ========================================================================
        async function supabaseRequest(path, options = {}) {
            const url = `${SUPABASE_URL}/rest/v1${path}`;
            const headers = {
                'Content-Type': 'application/json',
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                ...options.headers
            };
            const response = await fetch(url, { ...options, headers });
            if (!response.ok) {
                const error = await response.json().catch(() => ({}));
                throw new Error(error.message || '请求失败');
            }
            return response.json();
        }

        // ========================================================================
        //  2. 密码工具
        // ========================================================================
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // ========================================================================
        //  3. 用户管理
        // ========================================================================
        const SESSION_KEY = 'class_resource_session';

        function getSession() {
            try {
                const data = localStorage.getItem(SESSION_KEY);
                return data ? JSON.parse(data) : null;
            } catch {
                return null;
            }
        }

        function setSession(username) {
            localStorage.setItem(SESSION_KEY, JSON.stringify({ username, loginTime: Date.now() }));
        }

        function clearSession() {
            localStorage.removeItem(SESSION_KEY);
        }

        function isLoggedIn() {
            return !!getSession();
        }

        function getCurrentUser() {
            const session = getSession();
            return session ? session.username : null;
        }

        // ========================================================================
        //  4. 注册
        // ========================================================================
        async function register(username, password, passwordConfirm) {
            if (!username || username.length < 3 || username.length > 20) {
                throw new Error('用户名必须是 3-20 个字符');
            }
            if (!/^[a-zA-Z0-9_\u4e00-\u9fa5]+$/.test(username)) {
                throw new Error('用户名只能包含字母、数字、下划线和中文');
            }
            if (!password || password.length < 6) {
                throw new Error('密码至少 6 位');
            }
            if (password !== passwordConfirm) {
                throw new Error('两次输入的密码不一致');
            }

            const passwordHash = await hashPassword(password);

            const existing = await supabaseRequest(`/users?username=eq.${encodeURIComponent(username)}`);
            if (existing && existing.length > 0) {
                throw new Error('用户名已被占用');
            }

            await supabaseRequest('/users', {
                method: 'POST',
                body: JSON.stringify({
                    username: username,
                    password_hash: passwordHash
                })
            });

            return { success: true };
        }

        // ========================================================================
        //  5. 登录
        // ========================================================================
        async function login(username, password) {
            if (!username || !password) {
                throw new Error('请输入用户名和密码');
            }

            const passwordHash = await hashPassword(password);

            const users = await supabaseRequest(`/users?username=eq.${encodeURIComponent(username)}`);
            if (!users || users.length === 0) {
                throw new Error('用户名或密码错误');
            }

            const user = users[0];
            if (user.password_hash !== passwordHash) {
                throw new Error('用户名或密码错误');
            }

            setSession(username);
            return { success: true, username };
        }

        // ========================================================================
        //  6. 工具函数
        // ========================================================================
        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            const val = (bytes / Math.pow(k, i)).toFixed(1);
            return val + ' ' + sizes[i];
        }

        function getFileType(extension) {
            const ext = extension.toLowerCase();
            if (['pdf'].includes(ext)) return 'pdf';
            if (['doc', 'docx', 'txt', 'md', 'rtf'].includes(ext)) return 'doc';
            if (['jpg', 'jpeg', 'png', 'gif', 'bmp', 'svg', 'webp', 'ico'].includes(ext)) return 'image';
            if (['mp4', 'avi', 'mov', 'mkv', 'wmv', 'flv', 'webm'].includes(ext)) return 'video';
            if (['zip', 'rar', '7z', 'tar', 'gz', 'bz2'].includes(ext)) return 'zip';
            return 'other';
        }

        function getFileEmoji(extension) {
            const type = getFileType(extension);
            const map = {
                pdf: '📄',
                doc: '📝',
                image: '🖼️',
                video: '🎬',
                zip: '📦',
                other: '📁'
            };
            return map[type] || '📁';
        }

        function getFileColor(extension) {
            const type = getFileType(extension);
            const map = {
                pdf: '#EF4444',
                doc: '#3B82F6',
                image: '#8B5CF6',
                video: '#EC4899',
                zip: '#F59E0B',
                other: '#6B7280'
            };
            return map[type] || '#6B7280';
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        }

        // ========================================================================
        //  7. Toast 通知
        // ========================================================================
        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toastContainer');
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-times-circle',
                info: 'fa-info-circle'
            };
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span class="toast-icon"><i class="fas ${icons[type] || icons.info}"></i></span>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(30px)';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // ========================================================================
        //  8. IndexedDB 操作（本地文件）
        // ========================================================================
        const DB_NAME = 'ClassResourceDB';
        const STORE_NAME = 'files';
        let db = null;

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const d = e.target.result;
                    if (!d.objectStoreNames.contains(STORE_NAME)) {
                        d.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                    }
                };
                request.onsuccess = (e) => { db = e.target.result;
                    resolve(db); };
                request.onerror = (e) => reject(e.target.error);
            });
        }

        function getAllLocalFiles() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function addLocalFile(fileData) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const req = store.add(fileData);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function deleteLocalFile(id) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const req = store.delete(id);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        function clearAllLocalFiles() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const req = store.clear();
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        // ========================================================================
        //  9. GitHub 云端文件（只读）
        // ========================================================================
        const GH_USER = "TerryGao-FireFly";
        const GH_REPO = "-2510-";
        const GH_BRANCH = "main";

        async function fetchGithubFiles() {
            try {
                const res = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/?ref=${GH_BRANCH}`);
                if (!res.ok) throw new Error("API 限流或无法访问");
                const rawList = await res.json();
                const skipExt = ["html", "md", "yml", "json", "gitignore"];
                const cloudFiles = rawList
                    .filter(item => {
                        const ext = item.name.split('.').pop()?.toLowerCase() || "";
                        return item.type === "file" && !skipExt.includes(ext);
                    })
                    .map(item => {
                        const ext = item.name.split('.').pop() || "";
                        return {
                            source: "cloud",
                            id: "cloud_" + item.sha,
                            name: item.name,
                            extension: ext,
                            size: item.size,
                            uploadTime: new Date().toISOString(),
                            uploadedBy: "GitHub云端",
                            isAdmin: false,
                        }
                    });
                return cloudFiles;
            } catch (err) {
                console.error("GitHub 文件加载失败:", err);
                return [];
            }
        }

        // ========================================================================
        //  10. 渲染文件列表
        // ========================================================================
        let allFiles = [];
        let currentFilter = 'all';
        let searchQuery = '';
        const loggedIn = isLoggedIn();
        const currentUser = getCurrentUser();

        function renderFiles(fileList) {
            const grid = document.getElementById('fileGrid');
            const countEl = document.getElementById('resultCount');
            const fileCountEl = document.getElementById('fileCount');
            const totalSizeEl = document.getElementById('totalSize');

            let filtered = [...fileList];
            if (currentFilter !== 'all') {
                filtered = filtered.filter(f => getFileType(f.extension) === currentFilter);
            }
            if (searchQuery.trim()) {
                const q = searchQuery.trim().toLowerCase();
                filtered = filtered.filter(f => f.name.toLowerCase().includes(q));
            }

            countEl.textContent = `(${filtered.length} 个)`;
            fileCountEl.textContent = fileList.length;

            const totalBytes = fileList.reduce((sum, f) => sum + (f.size || 0), 0);
            totalSizeEl.textContent = formatSize(totalBytes);

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fas fa-inbox"></i></div>
                        <h3>${fileList.length === 0 ? '还没有任何资源' : '没有匹配的文件'}</h3>
                        <p>${fileList.length === 0 ? '等待管理员上传文件' : '试试其他关键词或筛选条件'}</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(file => {
                const color = getFileColor(file.extension);
                const emoji = getFileEmoji(file.extension);
                const typeLabel = getFileType(file.extension).toUpperCase();

                const isCloud = file.source === 'cloud';
                const uploaderName = file.uploadedBy || '未知用户';
                const isUploaderAdmin = isAdmin(uploaderName);

                // 判断当前用户是否有权限删除此文件
                let canDelete = false;
                if (loggedIn && currentUser) {
                    if (file.source === 'local') {
                        // 超级用户可以删除所有人的文件
                        if (isAdmin(currentUser)) {
                            canDelete = true;
                        } else if (file.uploadedBy === currentUser) {
                            canDelete = true;
                        }
                    }
                }

                // 上传者显示
                let uploaderHtml = '';
                if (file.source !== 'cloud') {
                    if (isUploaderAdmin) {
                        uploaderHtml = `
                            <div class="file-uploader">
                                <i class="fas fa-user-shield" style="color:var(--admin-color);"></i>
                                <span class="uploader-name admin">${uploaderName}</span>
                                <span class="admin-tag">管理员</span>
                            </div>
                        `;
                    } else {
                        uploaderHtml = `
                            <div class="file-uploader">
                                <i class="fas fa-user" style="color:#6B7280;"></i>
                                <span class="uploader-name">${uploaderName}</span>
                            </div>
                        `;
                    }
                } else {
                    uploaderHtml = `
                        <div class="file-uploader">
                            <i class="fas fa-cloud" style="color:#16a34a;"></i>
                            <span class="uploader-name" style="color:#16a34a;">${uploaderName}</span>
                        </div>
                    `;
                }

                // 操作按钮
                let actionHtml = '';
                if (loggedIn) {
                    let deleteBtnHtml = '';
                    if (canDelete) {
                        deleteBtnHtml = `<button class="delete-btn" data-id="${file.id}"><i class="fas fa-trash"></i> 删除</button>`;
                    } else if (file.source === 'local') {
                        deleteBtnHtml = `<button class="delete-btn" disabled><i class="fas fa-lock"></i> 无权删除</button>`;
                    }

                    actionHtml = `
                        <div class="file-actions">
                            <button class="download-btn" data-id="${file.id}"><i class="fas fa-download"></i> 下载</button>
                            ${deleteBtnHtml}
                        </div>
                    `;
                }

                return `
                    <div class="file-card" data-id="${file.id}" style="position:relative;">
                        ${!loggedIn ? `
                            <div class="locked-overlay">
                                <i class="fas fa-lock"></i>
                                <span>登录后查看</span>
                            </div>
                        ` : ''}
                        <span class="file-type-tag" style="background:${color}22; color:${color};">${typeLabel}</span>
                        <div class="file-icon-big" style="color:${color};">${emoji}</div>
                        <div class="file-name text-ellipsis" title="${file.name}">${file.name}</div>
                        <div class="file-meta">
                            <span>${formatSize(file.size)}</span>
                            <span>${isCloud ? '云端' : '本地'}</span>
                        </div>
                        ${uploaderHtml}
                        ${actionHtml}
                    </div>
                `;
            }).join('');

            // 绑定按钮事件
            if (loggedIn) {
                grid.querySelectorAll('.download-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.dataset.id;
                        const file = allFiles.find(f => f.id === id);
                        if (!file) return;

                        if (file.source === 'cloud') {
                            const downloadUrl =
                                `https://${GH_USER.toLowerCase()}.github.io/${GH_REPO}/${encodeURIComponent(file.name)}`;
                            window.open(downloadUrl, '_blank');
                            showToast(`📥 打开: ${file.name}`, 'info', 1500);
                        } else {
                            handleLocalDownload(id);
                        }
                    });
                });

                grid.querySelectorAll('.delete-btn:not([disabled])').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.dataset.id;
                        const file = allFiles.find(f => f.id == id);
                        if (file) {
                            showDeleteModal(id, file.name, file.uploadedBy);
                        }
                    });
                });
            }
        }

        // ========================================================================
        //  11. 本地文件操作
        // ========================================================================
        async function handleLocalDownload(id) {
            try {
                const allLocal = await getAllLocalFiles();
                const file = allLocal.find(f => f.id == id);
                if (!file) {
                    showToast('文件不存在', 'error');
                    return;
                }
                const blob = new Blob([file.data], { type: file.type || 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = file.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 60000);
                showToast(`📥 下载中: ${file.name}`, 'info', 1500);
            } catch (err) {
                console.error(err);
                showToast('下载失败', 'error');
            }
        }

        // ========================================================================
        //  12. 上传处理
        // ========================================================================
        async function handleUploadFiles(fileList) {
            if (!isLoggedIn()) {
                showToast('⚠️ 请先登录再上传文件', 'error', 3000);
                return;
            }

            const currentUser = getCurrentUser();
            const container = document.getElementById('progressContainer');
            container.classList.add('active');

            for (const file of Array.from(fileList)) {
                if (file.size > 100 * 1024 * 1024) {
                    showToast(`❌ ${file.name} 超过 100MB`, 'error');
                    continue;
                }

                const item = document.createElement('div');
                item.className = 'upload-progress-item';
                const ext = file.name.split('.').pop() || '';
                const emoji = getFileEmoji(ext);
                item.innerHTML = `
                    <span class="file-icon">${emoji}</span>
                    <div class="info">
                        <div class="name text-ellipsis">${file.name}</div>
                        <div class="size">${formatSize(file.size)}</div>
                    </div>
                    <div class="progress-track"><div class="fill" style="width:0%;"></div></div>
                    <span class="status">0%</span>
                `;
                container.appendChild(item);

                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const fileData = {
                        source: "local",
                        id: generateId(),
                        name: file.name,
                        size: file.size,
                        type: file.type || 'application/octet-stream',
                        extension: ext,
                        data: arrayBuffer,
                        uploadTime: new Date().toISOString(),
                        uploadedBy: currentUser,
                        isAdmin: isAdmin(currentUser)
                    };

                    let progress = 0;
                    const interval = setInterval(() => {
                        progress += Math.random() * 15 + 5;
                        if (progress >= 90) {
                            clearInterval(interval);
                            progress = 90;
                        }
                        const fill = item.querySelector('.fill');
                        const status = item.querySelector('.status');
                        fill.style.width = Math.min(progress, 90) + '%';
                        status.textContent = Math.min(progress, 90) + '%';
                    }, 100);

                    await addLocalFile(fileData);
                    clearInterval(interval);

                    const fill = item.querySelector('.fill');
                    const status = item.querySelector('.status');
                    fill.style.width = '100%';
                    status.textContent = '✅ 完成';
                    status.style.color = '#22C55E';

                    showToast(`✅ ${file.name} 上传成功`, 'success', 1500);

                } catch (err) {
                    console.error(err);
                    const status = item.querySelector('.status');
                    status.textContent = '❌ 失败';
                    status.style.color = '#EF4444';
                    showToast(`❌ ${file.name} 上传失败`, 'error');
                }
            }

            setTimeout(async () => {
                await refreshList();
                setTimeout(() => {
                    container.innerHTML = '';
                    container.classList.remove('active');
                }, 400);
            }, 400);
        }

        // ========================================================================
        //  13. 删除相关
        // ========================================================================
        let deleteTargetId = null;

        function showDeleteModal(id, name, uploader) {
            deleteTargetId = id;
            const currentUser = getCurrentUser();
            let msg = `确定要删除文件 "${name}" 吗？`;

            if (isAdmin(currentUser) && uploader !== currentUser) {
                msg = `🔑 管理员权限：确定要删除 "${uploader}" 上传的文件 "${name}" 吗？`;
            }

            document.getElementById('deleteModalMsg').textContent = msg;
            document.getElementById('deleteModal').classList.add('active');
        }

        function hideDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
            deleteTargetId = null;
        }

        async function confirmDelete() {
            if (deleteTargetId === null) return;
            try {
                await deleteLocalFile(deleteTargetId);
                showToast('🗑️ 文件已删除', 'success', 1500);
                await refreshList();
            } catch (err) {
                console.error(err);
                showToast('删除失败', 'error');
            }
            hideDeleteModal();
        }

        async function handleClearAll() {
            const localFiles = await getAllLocalFiles();
            if (localFiles.length === 0) {
                showToast('没有本地文件可清空', 'info');
                return;
            }
            if (confirm(`确定要删除全部 ${localFiles.length} 个本地文件吗？`)) {
                await clearAllLocalFiles();
                showToast('🗑️ 已清空全部本地文件', 'success', 1500);
                await refreshList();
            }
        }

        // ========================================================================
        //  14. 刷新列表
        // ========================================================================
        async function refreshList() {
            try {
                const local = await getAllLocalFiles();
                const cloud = await fetchGithubFiles();

                // 确保本地文件有 uploadedBy 字段
                const localWithUploader = local.map(f => {
                    if (!f.uploadedBy) {
                        f.uploadedBy = '未知用户';
                    }
                    return f;
                });

                allFiles = [...cloud, ...localWithUploader];
                allFiles.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
                renderFiles(allFiles);

                updateUI();

            } catch (err) {
                console.error('加载数据失败:', err);
                showToast('加载数据失败', 'error');
            }
        }

        // ========================================================================
        //  15. UI 更新
        // ========================================================================
        function updateUI() {
            const loggedIn = isLoggedIn();
            const username = getCurrentUser();

            const guestButtons = document.getElementById('guestButtons');
            const userInfo = document.getElementById('userInfo');
            const currentUsername = document.getElementById('currentUsername');
            const usernameDisplay = document.getElementById('usernameDisplay');

                        <span style="color:var(--admin-color);font-weight:700;">${username}</span>

        // ========================================================================
        //  16. 认证模态框控制
        // ========================================================================
        let currentAuthMode = 'login';

        function openAuthModal(mode = 'login') {
            currentAuthMode = mode;
            const modal = document.getElementById('authModal');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');

            if (mode === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                document.querySelectorAll('.error-text').forEach(el => el.classList.remove('show'));
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                document.querySelectorAll('.error-text').forEach(el => el.classList.remove('show'));
            }

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeAuthModal() {
            document.getElementById('authModal').classList.remove('active');
            document.body.style.overflow = '';
            document.querySelectorAll('#authModal input').forEach(el => el.value = '');
            document.querySelectorAll('.error-text').forEach(el => el.classList.remove('show'));
        }

        // ========================================================================
        //  17. 初始化 & 事件绑定
        // ========================================================================
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await openDB();
            } catch (err) {
                console.error('数据库打开失败:', err);
                showToast('⚠️ 本地存储初始化失败', 'error', 5000);
                return;
            }

            await refreshList();

            // ---- 顶栏按钮 ----
            document.getElementById('showLoginBtn').addEventListener('click', () => openAuthModal('login'));
            document.getElementById('showRegisterBtn').addEventListener('click', () => openAuthModal('register'));

            document.getElementById('logoutBtn').addEventListener('click', () => {
                clearSession();
                showToast('👋 已登出', 'info', 1500);
                updateUI();
                refreshList();
            });

            // ---- 模态框切换 ----
            document.getElementById('switchToRegister').addEventListener('click', (e) => {
                e.preventDefault();
                openAuthModal('register');
            });
            document.getElementById('switchToLogin').addEventListener('click', (e) => {
                e.preventDefault();
                openAuthModal('login');
            });
            document.getElementById('authModalClose').addEventListener('click', closeAuthModal);
            document.getElementById('authModal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closeAuthModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeAuthModal();
            });

            // ---- 登录 ----
            document.getElementById('loginSubmitBtn').addEventListener('click', async () => {
                const username = document.getElementById('loginUsername').value.trim();
                const password = document.getElementById('loginPassword').value;

                const usernameError = document.getElementById('loginUsernameError');
                const passwordError = document.getElementById('loginPasswordError');
                usernameError.classList.remove('show');
                passwordError.classList.remove('show');

                if (!username) {
                    usernameError.textContent = '请输入用户名';
                    usernameError.classList.add('show');
                    return;
                }
                if (!password) {
                    passwordError.textContent = '请输入密码';
                    passwordError.classList.add('show');
                    return;
                }

                const btn = document.getElementById('loginSubmitBtn');
                btn.disabled = true;
                btn.textContent = '登录中...';

                try {
                    await login(username, password);
                    closeAuthModal();
                    showToast(`✅ 欢迎回来，${username}！`, 'success', 2000);
                    await refreshList();
                    updateUI();
                } catch (err) {
                    showToast(`❌ ${err.message}`, 'error', 3000);
                    if (err.message.includes('用户名或密码')) {
                        passwordError.textContent = err.message;
                        passwordError.classList.add('show');
                    }
                } finally {
                    btn.disabled = false;
                    btn.textContent = '登 录';
                }
            });

            document.getElementById('loginPassword').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') document.getElementById('loginSubmitBtn').click();
            });
            document.getElementById('loginUsername').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') document.getElementById('loginSubmitBtn').click();
            });

            // ---- 注册 ----
            document.getElementById('registerSubmitBtn').addEventListener('click', async () => {
                const username = document.getElementById('registerUsername').value.trim();
                const password = document.getElementById('registerPassword').value;
                const confirm = document.getElementById('registerPasswordConfirm').value;

                const usernameError = document.getElementById('registerUsernameError');
                const passwordError = document.getElementById('registerPasswordError');
                const confirmError = document.getElementById('registerPasswordConfirmError');

                usernameError.classList.remove('show');
                passwordError.classList.remove('show');
                confirmError.classList.remove('show');

                if (!username || username.length < 3) {
                    usernameError.textContent = '用户名至少 3 个字符';
                    usernameError.classList.add('show');
                    return;
                }
                if (!password || password.length < 6) {
                    passwordError.textContent = '密码至少 6 位';
                    passwordError.classList.add('show');
                    return;
                }
                if (password !== confirm) {
                    confirmError.textContent = '两次输入密码不一致';
                    confirmError.classList.add('show');
                    return;
                }

                const btn = document.getElementById('registerSubmitBtn');
                btn.disabled = true;
                btn.textContent = '注册中...';

                try {
                    await register(username, password, confirm);
                    closeAuthModal();
                    showToast(`🎉 注册成功！请登录`, 'success', 2000);
                    openAuthModal('login');
                    document.getElementById('loginUsername').value = username;
                } catch (err) {
                    showToast(`❌ ${err.message}`, 'error', 3000);
                    if (err.message.includes('用户名')) {
                        usernameError.textContent = err.message;
                        usernameError.classList.add('show');
                    }
                } finally {
                    btn.disabled = false;
                    btn.textContent = '注 册';
                }
            });

            document.getElementById('registerPasswordConfirm').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') document.getElementById('registerSubmitBtn').click();
            });

            // ---- 上传 ----
            const uploadZone = document.getElementById('uploadZone');
            const fileInput = document.getElementById('fileInput');

            uploadZone.addEventListener('click', () => {
                if (!isLoggedIn()) {
                    showToast('⚠️ 请先登录再上传文件', 'error', 3000);
                    return;
                }
                fileInput.click();
            });

            uploadZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (isLoggedIn()) uploadZone.classList.add('dragover');
            });
            uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
            uploadZone.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadZone.classList.remove('dragover');
                if (!isLoggedIn()) {
                    showToast('⚠️ 请先登录再上传文件', 'error', 3000);
                    return;
                }
                if (e.dataTransfer.files.length > 0) {
                    handleUploadFiles(e.dataTransfer.files);
                }
            });
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    handleUploadFiles(e.target.files);
                    e.target.value = '';
                }
            });

            // ---- 搜索 ----
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderFiles(allFiles);
            });

            // ---- 筛选 ----
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderFiles(allFiles);
                });
            });

            // ---- 刷新 ----
            document.getElementById('refreshBtn').addEventListener('click', async () => {
                const btn = document.getElementById('refreshBtn');
                btn.innerHTML = '<i class="fas fa-sync-alt fa-spin"></i> 刷新中...';
                btn.disabled = true;
                await refreshList();
                btn.innerHTML = '<i class="fas fa-sync-alt"></i> 刷新';
                btn.disabled = false;
                showToast('✅ 已刷新', 'success', 1000);
            });

            // ---- 清空本地 ----
            document.getElementById('clearAllBtn').addEventListener('click', handleClearAll);

            // ---- 删除模态框 ----
            document.getElementById('modalCancelBtn').addEventListener('click', hideDeleteModal);
            document.getElementById('modalConfirmBtn').addEventListener('click', confirmDelete);
            document.getElementById('deleteModal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) hideDeleteModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') hideDeleteModal();
            });

            console.log('✅ 2510班资源站已启动！');
            console.log(`👤 当前用户: ${getCurrentUser() || '未登录'}`);
            console.log(`👑 超级用户: ${ADMIN_USERS.join(', ')}`);
        });
    </script>

</body>
</html>
