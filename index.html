<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2510班资源站</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{max-width:960px;margin:40px auto;padding:0 20px;background:#f6f8fa}
        h1{text-align:center;margin-bottom:30px;color:#222}
        .item{
            background:#fff;
            padding:16px;
            border-radius:10px;
            margin-bottom:12px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        a{
            padding:8px 16px;
            background:#238636;
            color:white;
            text-decoration:none;
            border-radius:6px;
        }
        a:hover{background:#2ea043}
        .empty{text-align:center;padding:60px;color:#666}
    </style>
</head>
<body>
    <h1>2510班资源列表</h1>
    <div id="list" class="empty">正在加载资源...</div>

    <script>
        // ========== 这里改成你的信息 ==========
        const USER = "TerryGao-FireFly";
        const REPO = "-2510-";
        const BRANCH = "main";
        // =====================================

        const listDom = document.getElementById("list");
        fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/?ref=${BRANCH}`)
        .then(res=>res.json())
        .then(files=>{
            listDom.innerHTML = "";
            // 过滤文件夹、html、md等，只展示资源文件
            const filterFile = files.filter(item=>{
                const ext = item.name.split('.').pop().toLowerCase();
                const skip = ["html","md","yml","json"];
                return item.type === "file" && !skip.includes(ext);
            })

            if(filterFile.length === 0){
                listDom.innerHTML = `<div class="empty">暂无任何资源</div>`;
                return;
            }

            filterFile.forEach(file=>{
                const div = document.createElement("div");
                div.className = "item";
                // 直链地址
                const downloadUrl = `https://${USER}.github.io/${REPO}/${encodeURIComponent(file.name)}`
                div.innerHTML = `
                    <span>${file.name}</span>
                    <a href="${downloadUrl}" target="_blank">下载</a>
                `
                listDom.appendChild(div);
            })
        })
        .catch(err=>{
            listDom.innerHTML = `<div class="empty">加载失败，接口限流，请稍后刷新</div>`;
            console.error(err);
        })
    </script>
</body>
</html>
